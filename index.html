<!DOCTYPE html><html lang="hi"><head><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/bolo-icon.svg" type="image/svg+xml"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101525"><title>Bolo AI — Your Smart Assistant</title><style>:root{--bg:#0b1020;--panel:#121a2c;--panel2:#1a253a;--text:#f3f6ff;--muted:#9ba9c4;--line:#2a3650;--accent:#7367ff;--bubble:#202b43}body.light{--bg:#f3f5fb;--panel:#fff;--panel2:#edf0f9;--text:#182036;--muted:#68738c;--line:#dce2ee;--bubble:#e9edfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}aside{width:260px;background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:15px}main{display:flex;height:100dvh}.brand{font-weight:850;font-size:23px;letter-spacing:-.5px}.brand span{color:#8e83ff}.small{color:var(--muted);font-size:12px}.new,.send{border:0;background:linear-gradient(135deg,#7466ff,#a05cff);color:#fff;border-radius:13px;padding:13px;font-weight:700}.image-tray{max-width:850px;margin:0 auto 8px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);align-items:center;gap:11px}.image-tray[hidden]{display:none}.image-tray:not([hidden]){display:flex}.image-tray img{width:54px;height:54px;object-fit:cover;border-radius:9px}.image-info{flex:1;min-width:0}.image-info strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.image-info span{font-size:11px;color:var(--muted)}.chat-image{display:block;max-width:min(100%,520px);max-height:560px;object-fit:contain;border-radius:12px;margin-top:10px}.download-image{display:inline-block;color:#c3bfff;font-size:13px;margin-top:8px;text-decoration:none}.image-error{color:#ffb6b6}.history{flex:1;overflow:auto}.history button{display:block;text-align:left;width:100%;background:none;color:var(--text);border:0;padding:12px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:var(--panel2)}.sidebtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px}.workspace{flex:1;min-width:0;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.top b{font-size:17px}.top .status{color:#49dca6;font-size:12px}.chat{flex:1;overflow-y:auto;padding:24px 20px}.inner{max-width:850px;margin:auto}.welcome{text-align:center;padding:7vh 0 20px}.logo{width:74px;height:74px;display:grid;place-items:center;margin:auto;border-radius:23px;background:linear-gradient(145deg,#7165ff,#bc68ff);font-size:36px;box-shadow:0 14px 50px #7666ff44}.welcome h1{font-size:clamp(25px,5vw,38px);margin:23px 0 8px}.welcome p{color:var(--muted)}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:650px;margin:25px auto}.suggestions button{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:17px}.msg{display:flex;gap:12px;margin:20px 0;align-items:flex-start}.msg.user{flex-direction:row-reverse}.avatar{width:33px;height:33px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:white;font-size:14px}.msg.user .avatar{background:#35415c}.bubble{background:var(--bubble);padding:15px 17px;border-radius:16px;max-width:min(88%,700px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .bubble{background:#5045c4;color:#fff}.composer{padding:15px 22px 19px;background:var(--bg)}.composebox{max-width:850px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:10px}.composebox textarea{flex:1;resize:none;max-height:170px;min-height:44px;padding:11px 7px;background:none;border:0;outline:0;color:var(--text)}.iconbtn{border:0;border-radius:12px;padding:12px;background:var(--panel2);color:var(--text)}.send{padding:13px 17px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}.menu{display:none}@media(max-width:700px){aside{position:absolute;z-index:5;inset:0 auto 0 0;transform:translateX(-100%);transition:.2s;box-shadow:8px 0 40px #0004}aside.open{transform:none}.menu{display:inline-block}.top{padding:14px}.chat{padding:15px}.composer{padding:10px}.suggestions{grid-template-columns:1fr}.welcome{padding-top:3vh}.bubble{max-width:88%}}</style></head><body><main><aside id="sidebar"><div class="brand">✦ Bolo <span>AI</span></div><div class="small">Your intelligent everyday companion</div><button class="new" onclick="newChat()">＋ New conversation</button><div class="small">RECENT CHATS</div><div class="history" id="history"></div><button class="sidebtn" onclick="toggleTheme()">☼ Change theme</button><button class="sidebtn" onclick="clearHistory()">⌫ Clear all chats</button><div class="small">Bolo AI • Powered by your backend</div></aside><section class="workspace"><header class="top"><div><button class="iconbtn menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button> <b>✦ Bolo AI</b><div class="status" id="status">● Checking connection...</div></div><button class="iconbtn" onclick="newChat()" title="New chat">＋</button></header><div class="chat" id="chat"><div class="inner" id="messages"></div></div><div class="composer"><div class="image-tray" id="imageTray" hidden><img id="imageThumb" alt="Selected image preview"><div class="image-info"><strong id="imageName"></strong><span>Photo is sent to Gemini for editing · PNG/JPG/WEBP · max 7 MB</span></div><button class="iconbtn" onclick="clearImage()" title="Remove image">✕</button></div><div class="composebox"><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="onImageSelected(event)"><button class="iconbtn attachbtn" onclick="$('imageFile').click()" title="Edit a photo" aria-label="Edit a photo">🖼</button><button class="iconbtn" onclick="voiceInput()" title="Speak">🎙</button><textarea id="prompt" rows="1" placeholder="Ask Bolo AI anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><button class="send" id="send" onclick="sendMessage()">➤</button></div><div class="foot">AI can make mistakes. Verify important information.</div></div></section></main><script>
const BASE='';const ENDPOINTS=['/api/chat','/chat','/api/ask','/ask'];let sessions=JSON.parse(localStorage.getItem('bolo_sessions')||'[]');let current=null;let busy=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem('bolo_sessions',JSON.stringify(sessions))}function newChat(){current=Date.now().toString();sessions.unshift({id:current,title:'New conversation',messages:[]});save();render();$('sidebar').classList.remove('open')}function render(){if(!current||!sessions.some(s=>s.id===current)){if(sessions.length)current=sessions[0].id;else{newChat();return}}let s=sessions.find(x=>x.id===current);$('history').replaceChildren();sessions.forEach(x=>{let b=document.createElement('button');b.textContent='◷ '+x.title;b.onclick=()=>{current=x.id;render();$('sidebar').classList.remove('open')};$('history').append(b)});$('messages').replaceChildren();if(!s.messages.length){let w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="logo">✦</div><h1>How can I help you today?</h1><p>Ask questions, write content, learn something new or get creative.</p>';let sug=document.createElement('div');sug.className='suggestions';['✍️ Write a professional email','💡 Give me business ideas','📚 Explain something in Hindi','💻 Help me write code'].forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('prompt').value=t.slice(3);$('prompt').focus()};sug.append(b)});w.append(sug);$('messages').append(w)}else s.messages.forEach(m=>addMessage(m.role,m.content));scrollBottom()}function addMessage(role,content){let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'assistant');let a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'U':'✦';let b=document.createElement('div');b.className='bubble';b.textContent=content;d.append(a,b);$('messages').append(d);scrollBottom();return b}function scrollBottom(){$('chat').scrollTop=$('chat').scrollHeight}function extract(data){if(typeof data==='string')return data;return data?.reply||data?.response||data?.answer||data?.message||data?.text||data?.content||data?.choices?.[0]?.message?.content||data?.data?.reply||data?.data?.response||null}async function requestAI(message,messages){let lastError='';for(let path of ENDPOINTS){try{let response=await fetch(BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,prompt:message,question:message,messages:messages.map(m=>({role:m.role,content:m.content}))})});let raw=await response.text();let data;try{data=JSON.parse(raw)}catch{data=raw}if((response.status===404||response.status===405)&&typeof data==='string'&&data.includes('Cannot POST')){lastError=path+' not available';continue}if(!response.ok)throw Error((typeof data==='object'&&(data.error||data.message))||'HTTP '+response.status);let answer=extract(data);if(!answer)throw Error('Backend returned no readable reply. Check response format.');return answer}catch(e){lastError=e.message;if(!/not available/.test(lastError))break}}throw Error(lastError||'No supported chat endpoint found')}async function sendMessage(){let text=$('prompt').value.trim();if(!text||busy)return;busy=true;$('send').disabled=true;$('prompt').value='';let s=sessions.find(x=>x.id===current);s.messages.push({role:'user',content:text});if(s.messages.length===1)s.title=text.slice(0,38);save();render();let loading=addMessage('assistant','Thinking...');try{let reply=await requestAI(text,s.messages);s.messages.push({role:'assistant',content:reply});loading.textContent=reply;$('status').textContent='● Backend connected'}catch(e){loading.textContent='⚠️ '+e.message}finally{busy=false;$('send').disabled=false;save();$('prompt').focus()}}async function check(){try{let r=await fetch(BASE+'/');$('status').textContent=r.ok?'● Backend online':'● Backend returned '+r.status}catch{$('status').textContent='● Backend connection unavailable'}}function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('bolo_theme',document.body.classList.contains('light')?'light':'dark')}function clearHistory(){if(confirm('Delete all local chat history?')){sessions=[];current=null;save();newChat()}}function voiceInput(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice input is not supported in this browser. Try Chrome.');return}let r=new SR();r.lang='hi-IN';r.onresult=e=>{$('prompt').value=e.results[0][0].transcript};r.start()}let selectedImage=null,selectedImageUrl=null;const transientImages=new Map();
function imageKey(sessionId,index){return sessionId+':'+index}
function addImageToBubble(bubble,item){let img=document.createElement('img');img.className='chat-image';img.src=item.src;img.alt=item.alt||'Image';bubble.append(img);if(item.download){let a=document.createElement('a');a.className='download-image';a.href=item.src;a.download=item.name||'bolo-ai-edited.png';a.textContent='↓ Download edited image';bubble.append(a)}}
function onImageSelected(event){let file=event.target.files&&event.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('Please choose a PNG, JPG, or WEBP image.');event.target.value='';return}if(file.size>7*1024*1024){alert('Choose an image smaller than 7 MB.');event.target.value='';return}selectedImage=file;selectedImageUrl=URL.createObjectURL(file);$('imageThumb').src=selectedImageUrl;$('imageName').textContent=file.name;$('imageTray').hidden=false;$('prompt').placeholder='Describe how you want to edit this image...';$('prompt').focus()}
function clearImage(){$('imageFile').value='';selectedImage=null;$('imageTray').hidden=true;$('prompt').placeholder='Ask Bolo AI anything...'}
async function editUploadedImage(file,prompt){const dataUrl=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read the selected image.'));reader.readAsDataURL(file)});const dimensions=await new Promise(resolve=>{let im=new Image();im.onload=()=>resolve([im.naturalWidth,im.naturalHeight]);im.onerror=()=>resolve([1,1]);im.src=dataUrl});const ratio=dimensions[0]/dimensions[1],options=[['1:1',1],['3:2',1.5],['2:3',2/3],['4:3',4/3],['3:4',.75],['16:9',16/9],['9:16',9/16]];const aspectRatio=options.reduce((best,item)=>Math.abs(item[1]-ratio)<Math.abs(best[1]-ratio)?item:best,options[0])[0];const response=await fetch('/api/edit-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl.split(',')[1],mimeType:file.type,prompt,aspectRatio})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Image editing failed.');if(!data.image)throw new Error('Gemini returned no edited image.');return data}
const originalRender=window.render;window.render=function(){originalRender();let s=sessions.find(item=>item.id===current);if(!s)return;Array.from($('messages').querySelectorAll('.msg')).forEach((node,index)=>{let image=transientImages.get(imageKey(s.id,index));let bubble=node.querySelector('.bubble');if(image&&bubble)addImageToBubble(bubble,image)})};
const originalSendMessage=window.sendMessage;window.sendMessage=async function(){const text=$('prompt').value.trim();if(!selectedImage)return originalSendMessage();if(!text||busy)return;busy=true;$('send').disabled=true;$('prompt').value='';const file=selectedImage,s=sessions.find(item=>item.id===current),sessionId=s.id,userIndex=s.messages.length;s.messages.push({role:'user',content:'🖼 Edit image: '+text});transientImages.set(imageKey(sessionId,userIndex),{src:selectedImageUrl,alt:'Image uploaded for editing'});if(s.messages.length===1)s.title='🖼 '+text.slice(0,34);save();render();addMessage('assistant','Editing image...');try{const result=await editUploadedImage(file,text),outputIndex=s.messages.length,src='data:'+(result.mimeType||'image/png')+';base64,'+result.image;s.messages.push({role:'assistant',content:result.text||'Image edit is ready.'});transientImages.set(imageKey(sessionId,outputIndex),{src,alt:'Edited image',download:true,name:'bolo-ai-edited.'+((result.mimeType||'image/png').split('/')[1]||'png')});$('status').textContent='● Backend connected'}catch(error){s.messages.push({role:'assistant',content:'⚠️ '+error.message})}finally{clearImage();busy=false;$('send').disabled=false;save();render();$('prompt').focus()}};
if(localStorage.getItem('bolo_theme')==='light')document.body.classList.add('light');render();check();
</script></body></html>
